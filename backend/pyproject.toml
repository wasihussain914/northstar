[project]
name = "untangled-backend"
version = "0.1.0"
description = "Untangled: a GPS for solving math problems"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sympy>=1.14.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
